faq:
  - pregunta: ¿Quién puede unirse a la Rama?
    respuesta: 'Cualquier estudiante de la Universidad Distrital, de cualquier carrera. No necesitas ser de eléctrica o electrónica: hay espacio para software, biomédica, ciencias de la Tierra, energía y mucho más.'
  - pregunta: ¿Tengo que pagar para participar?
    respuesta: No para empezar. Puedes asistir a eventos abiertos y ser voluntario sin ser miembro. La membresía IEEE es opcional, tiene una cuota anual que fija IEEE y te da beneficios globales como IEEE Xplore.
  - pregunta: ¿Cómo me hago miembro IEEE?
    respuesta: Creas tu cuenta en ieee.org, eliges la membresía estudiantil y seleccionas la Rama de la Universidad Distrital (STB04331). Después puedes sumar los capítulos técnicos que te interesen.
  - pregunta: ¿Puedo estar en varios capítulos a la vez?
    respuesta: Sí. Puedes añadir varias sociedades técnicas a tu membresía y participar en las actividades de cada capítulo.
  - pregunta: ¿Cómo participo como voluntario?
    respuesta: Escríbenos o acércate a la mesa directiva o a un capítulo. Siempre buscamos manos para logística, diseño, comunicaciones y proyectos técnicos.
