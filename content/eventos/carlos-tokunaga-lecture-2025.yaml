titulo: 'Conferencia técnica: circuitos integrados avanzados con Carlos Tokunaga'
tipo: CONFERENCE
fechaInicio: '2025-09-25'
horario: 09:00 AM - 10:00 AM (-05)
lugar: Bogotá D.C, Colombia
resumen: Conferencia técnica exclusiva con el Dr. Carlos Tokunaga sobre avances en diseño de circuitos, eficiencia energética de microprocesadores y escalamiento de dispositivos electrónicos.
imagen: /images/eventos/carlos-tokunaga-lecture.jpg
