descripcion: Una destacada delegación de la Rama Estudiantil IEEE Universidad Distrital participó en la Reunión Nacional de Ramas (RNR) 2025, realizada en Bucaramanga / Girón, Santander. Este evento insignia reunió a cientos de voluntarios de toda la Sección Colombia en un programa integral enfocado en liderazgo, planeación estratégica y crecimiento profesional.
impacto: Nuestros miembros asistieron a una serie de talleres y conferencias magistrales de alto impacto centrados en habilidades blandas, como inteligencia emocional, oratoria y resolución de conflictos. La reunión también fue un espacio muy valioso de networking, que permitió a nuestros voluntarios intercambiar modelos de proyectos exitosos con otras ramas y fortalecer los lazos con el liderazgo de la Sección IEEE Colombia y el SAC Team. Esta participación les dio a nuestros miembros las herramientas necesarias para ampliar el impacto de nuestra rama y fomentar un ambiente más colaborativo en nuestra universidad.
conclusion: La participación en la RNR 2025 reforzó el compromiso, la cohesión del equipo y la integración regional de los voluntarios de IEEE Universidad Distrital, y les brindó herramientas clave para liderar futuras iniciativas tecnológicas y sociales en la comunidad académica.
