fechaFin: '2025-12-06'
horario: 05 dic 08:30 AM - 06 dic 12:00 PM (-05)
lugar: Universidad del Quindío, Armenia / Bogotá D.C, Colombia
resumen: Democratización de la microelectrónica mediante el diseño de chips RTL-to-GDSII con herramientas EDA de código abierto, organizado por IEEE SSCS Sección Colombia.
