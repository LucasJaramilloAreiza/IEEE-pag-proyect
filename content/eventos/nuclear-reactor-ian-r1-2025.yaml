titulo: Visita técnica al reactor nuclear IAN-R1
tipo: VISIT
fechaInicio: '2025-08-01'
horario: 11:00 AM - 12:30 PM (-05)
lugar: Sede CAN, Servicio Geológico Colombiano, Bogotá D.C., Colombia
resumen: Visita técnica del Capítulo IEEE PES al reactor nuclear IAN-R1 del Servicio Geológico Colombiano para conocer los principios de la energía nuclear, sus aplicaciones en investigación y los protocolos de seguridad radiológica.
