titulo: 'IEEE PELS Day 2026 - Taller: retos y oportunidades de la electrónica de potencia en Colombia'
tipo: WORKSHOP
fechaInicio: '2026-06-25'
horario: 01:30 PM - 07:30 PM (-05)
lugar: Edificio Mario Laserna (ML), Lab ML009, UniAndes, Bogotá
resumen: Un puente entre la teoría y la industria a través de la manufactura práctica en electrónica de potencia, con el Bus ShowRoom de Siemens y Ectricol y el PCB Assembly Contest.
