titulo: MicroJam Competition – Primera edición (hackatón de hardware)
tipo: HACKATHON
fechaInicio: '2025-11-07'
fechaFin: '2025-11-08'
horario: 08:00 AM - 05:00 PM (-05) cada día
lugar: Sede Ingeniería, Universidad Distrital Francisco José de Caldas, Bogotá D.C, Colombia
resumen: Competencia intensiva de hardware de dos días que retó a equipos estudiantiles a conceptualizar, programar y ensamblar instrumentos creativos basados en microcontroladores con integración de sensores.
