titulo: Visita técnica al laboratorio sinfonIA
tipo: VISIT
fechaInicio: '2025-10-04'
horario: 02:00 PM - 04:00 PM (-05)
lugar: Laboratorio Colibrí, Cra 1 Nº 18A-12, Bogotá D.C, Colombia
resumen: Visita técnica del Capítulo IEEE RAS al laboratorio Colibrí y al grupo de investigación SinfonIA para conocer de cerca la robótica social, la IA corporizada y las plataformas humanoides Unitree G1, Pepper y NAO.
imagen: /images/eventos/sinfonia-lab-visit.png
