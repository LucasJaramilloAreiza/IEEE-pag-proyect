capitulos:
  - ras
descripcion: Visita técnica del Capítulo IEEE Robotics and Automation Society (RAS) de la Universidad Distrital al laboratorio Colibrí, donde los miembros se conectaron con el grupo SinfonIA, un equipo de investigación líder en robótica social e inteligencia artificial. Compartimos un espacio recreativo y técnico para conocer robots humanoides de vanguardia que ya habíamos visto antes, como el Unitree G1, Pepper y NAO, con el fin de que los voluntarios del capítulo se familiarizaran más con la robótica y la automatización.
ejes: |-
  Robots humanoides y plataformas de IA corporizada: Unitree G1, Pepper y NAO

  Durante la sesión interactiva, los voluntarios estudiantiles exploraron plataformas de última generación en robótica social y sistemas autónomos:

  • Unitree G1: Plataforma humanoide bípeda diseñada para locomoción dinámica ágil, control del equilibrio e inteligencia corporizada avanzada.
  • Pepper: Robot humanoide de interacción social con percepción multidireccional, reconocimiento facial y capacidades conversacionales.
  • NAO: Robot bípedo de alta precisión utilizado en todo el mundo para investigación en cinemática, visión por computador y rutinas de comportamiento autónomo.
impacto: |-
  Democratización de la robótica avanzada y sinergia interinstitucional

  Esta visita les permitió a nuestros voluntarios tener contacto práctico con robótica humanoide funcional, lo que despertó nuevas ideas para proyectos del capítulo y fortaleció la colaboración con laboratorios de investigación especializados en Bogotá.

  Al conocer de cerca estas tecnologías, los voluntarios de RAS UD refuerzan sus habilidades en control de robots, visión por computador e interacción humano-robot.
conclusion: La visita al laboratorio sinfonIA representó un inspirador acercamiento a la frontera tecnológica de la robótica humanoide e inteligencia artificial para el Capítulo IEEE RAS UD, consolidando su entusiasmo y preparación técnica hacia nuevos desafíos de automatización.
